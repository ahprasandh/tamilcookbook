<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Cookbook — Image Picker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f6f2; color: #333; }
  .app { display: flex; height: 100vh; flex-direction: column; }

  /* Sticky header */
  .sticky-header { position: sticky; top: 0; z-index: 10; background: #f8f6f2; padding: 16px 24px 0; border-bottom: 1px solid #e5e0d8; }

  /* Scrollable content */
  .scroll-area { flex: 1; overflow-y: auto; padding: 16px 24px 24px; }

  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 16px; }
  .top-bar { background: #fff; padding: 10px 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #e5e0d8; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .top-bar .stats { font-size: 14px; }
  .top-bar .stats span { font-weight: 600; color: #e67e22; }
  .save-all-btn { padding: 8px 20px; background: #22c55e; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .15s; }
  .save-all-btn:hover { background: #16a34a; transform: scale(1.02); }
  .save-all-btn:disabled { background: #aaa; cursor: not-allowed; transform: none; }
  .save-all-btn .count { background: rgba(255,255,255,.3); padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-size: 12px; }
  .tabs { display: flex; gap: 0; border-bottom: 2px solid #e5e0d8; }
  .tab { padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: none; color: #999; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }
  .tab:hover { color: #666; }
  .tab.active { color: #e67e22; border-bottom-color: #e67e22; }
  .tab .tab-count { font-weight: 400; font-size: 12px; color: #bbb; margin-left: 4px; }
  .tab.active .tab-count { color: #e67e22; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .header-row h1 { flex-shrink: 0; }
  .header-search { padding: 7px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; width: 280px; }
  .header-search:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.15); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 10px; border: 1px solid #e5e0d8; overflow: hidden; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .card.done { opacity: 1; }
  .card.replaced { border-color: #22c55e; }
  .card.active-search { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.3); }
  .card-header { padding: 10px 14px 6px; display: flex; justify-content: space-between; align-items: center; }
  .card-header h3 { font-size: 14px; }
  .card-header .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #ffecd2; color: #e67e22; }
  .card-header .badge.done { background: #d4edda; color: #28a745; }
  .card-body { padding: 0 14px 12px; }
  .search-btn { display: inline-block; font-size: 12px; color: #3b82f6; background: #f0f7ff; border: 1px solid #c5ddf8; padding: 3px 10px; border-radius: 6px; text-decoration: none; margin-bottom: 8px; cursor: pointer; transition: all .1s; }
  .search-btn:hover { background: #dbeafe; }
  .paste-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 16px 10px; text-align: center; color: #aaa; font-size: 13px; cursor: pointer; transition: all .15s; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; outline: none; }
  .paste-zone:hover, .paste-zone:focus { border-color: #3b82f6; color: #3b82f6; background: #f0f7ff; }
  .paste-zone.active { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }
  .paste-zone.has-image { border-style: solid; border-color: #22c55e; padding: 8px; }
  .paste-zone .hint { font-size: 11px; color: #bbb; }
  .paste-zone img { max-width: 100%; max-height: 120px; border-radius: 6px; object-fit: cover; }
  .paste-actions { display: flex; gap: 6px; margin-top: 6px; }
  .paste-actions button { padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; }
  .btn-clear { background: #eee; color: #666; }
  .btn-clear:hover { background: #ddd; }
  .msg { font-size: 11px; margin-top: 4px; padding: 3px 8px; border-radius: 4px; }
  .msg.ok { background: #d4edda; color: #155724; }
  .msg.err { background: #f8d7da; color: #721c24; }
  .existing-img { width: 100%; height: 100px; object-fit: cover; }
  kbd { background: #eee; border: 1px solid #ddd; border-radius: 3px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>

<div class="app">
<div class="sticky-header">

<div class="header-row">
  <h1>🍽️ Image Picker</h1>
  <input type="text" class="header-search" id="filterSearch" placeholder="Search recipe…" />
  <button class="save-all-btn" id="saveAllBtn" onclick="saveAll()" disabled>
    💾 Save All <span class="count" id="pendingCount">0</span>
  </button>
</div>

<div class="top-bar">
  <div class="stats" id="stats">Loading…</div>
</div>

<div class="tabs">
  <button class="tab active" id="tabMissing" onclick="switchTab('missing')">Missing <span class="tab-count" id="missingCount">0</span></button>
  <button class="tab" id="tabDownloaded" onclick="switchTab('downloaded')">Downloaded <span class="tab-count" id="downloadedCount">0</span></button>
</div>

</div><!-- sticky-header -->

<div class="scroll-area">
<div class="grid" id="grid"></div>
</div><!-- scroll-area -->

</div><!-- app -->

<script>
const RECIPES = [];

function displayName(id) {
  return id.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function googleUrl(id) {
  const q = encodeURIComponent(displayName(id) + ' Indian food');
  return `https://www.google.com/search?tbm=isch&q=${q}`;
}

let existing = new Set();
let downloaded = new Set();
const pending = new Map();
let activeTab = 'missing';
let allRecipeIds = [];

async function loadExisting() {
  const [recipeRes, existingRes] = await Promise.all([
    fetch('/recipes'),
    fetch('/existing'),
  ]);
  const recipeIds = await recipeRes.json();
  RECIPES.length = 0;
  RECIPES.push(...recipeIds);
  existing = new Set(await existingRes.json());
  const allIds = new Set([...RECIPES, ...existing]);
  allRecipeIds = [...allIds].sort();
}

function updateStats() {
  const missingCount = allRecipeIds.filter(r => !existing.has(r) && !downloaded.has(r)).length;
  const doneCount = allRecipeIds.filter(r => existing.has(r) || downloaded.has(r)).length;
  document.getElementById('stats').innerHTML =
    `Total: <span>${allRecipeIds.length}</span> &nbsp;|&nbsp; Downloaded: <span>${doneCount}</span> &nbsp;|&nbsp; Missing: <span>${missingCount}</span>`;
  document.getElementById('missingCount').textContent = missingCount;
  document.getElementById('downloadedCount').textContent = doneCount;
  updatePendingCount();
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabMissing').classList.toggle('active', tab === 'missing');
  document.getElementById('tabDownloaded').classList.toggle('active', tab === 'downloaded');
  renderCards();
}

function updatePendingCount() {
  const count = pending.size;
  const el = document.getElementById('pendingCount');
  if (el) el.textContent = count;
  document.getElementById('saveAllBtn').disabled = count === 0;
}

// ── Search panel ──
function openSearch(id) {
  const url = googleUrl(id);
  // Highlight active card
  document.querySelectorAll('.card.active-search').forEach(c => c.classList.remove('active-search'));
  const card = document.getElementById(`card-${id}`);
  if (card) { card.classList.add('active-search'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  // Focus paste zone so user can paste immediately when they return
  const zone = document.getElementById(`paste-${id}`);
  if (zone) zone.focus();
  window.open(url, '_blank');
}

// ── Render cards ──
function renderCards() {
  const grid = document.getElementById('grid');
  const search = document.getElementById('filterSearch').value.toLowerCase();

  grid.innerHTML = '';
  for (const id of allRecipeIds) {
    const isDone = existing.has(id) || downloaded.has(id);
    if (activeTab === 'missing' && isDone) continue;
    if (activeTab === 'downloaded' && !isDone) continue;
    if (search && !displayName(id).toLowerCase().includes(search)) continue;

    const hasPending = pending.has(id);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${id}`;

    if (activeTab === 'downloaded') {
      // Downloaded tab: show existing image + replace option
      card.innerHTML = `
        <img class="existing-img" src="/images/recipes/${id}.jpg?t=${Date.now()}" onerror="this.style.display='none'" />
        <div class="card-header">
          <h3>${displayName(id)}</h3>
          <span class="badge done">✓ Done</span>
        </div>
        <div class="card-body">
          <span class="search-btn" onclick="openSearch('${id}')">🔍 Search</span>
          <div class="paste-zone ${hasPending ? 'has-image' : ''}" id="paste-${id}" tabindex="0" data-id="${id}">
            ${hasPending
              ? `<img src="${pending.get(id)}" /><div class="paste-actions"><button class="btn-clear" onclick="event.stopPropagation();clearPaste('${id}')">✕ Clear</button></div>`
              : `<span>📋 Paste to replace (<kbd>⌘V</kbd>)</span>`
            }
          </div>
          <div id="msg-${id}"></div>
        </div>
      `;
      setupPasteHandlers(id, card);
    } else {
      // Missing tab
      card.innerHTML = `
        <div class="card-header">
          <h3>${displayName(id)}</h3>
          <span class="badge ${hasPending ? 'pending' : ''}">${hasPending ? '⏳ Pending' : 'Missing'}</span>
        </div>
        <div class="card-body">
          <span class="search-btn" onclick="openSearch('${id}')">🔍 Search</span>
          <div class="paste-zone ${hasPending ? 'has-image' : ''}" id="paste-${id}" tabindex="0" data-id="${id}">
            ${hasPending
              ? `<img src="${pending.get(id)}" /><div class="paste-actions"><button class="btn-clear" onclick="event.stopPropagation();clearPaste('${id}')">✕ Clear</button></div>`
              : `<span>📋 Paste image here (<kbd>⌘V</kbd>)</span><span class="hint">or drag &amp; drop</span>`
            }
          </div>
          <div id="msg-${id}"></div>
        </div>
      `;
      setupPasteHandlers(id, card);
    }
    grid.appendChild(card);
  }
}

function setupPasteHandlers(id, card) {
  const zone = card.querySelector(`#paste-${id}`);
  if (!zone) return;

  // Click to focus so paste events work
  zone.addEventListener('click', () => zone.focus());

  zone.addEventListener('paste', (e) => {
    e.preventDefault();
    for (const item of e.clipboardData.items) {
      if (item.type.startsWith('image/')) {
        handleImageFile(id, item.getAsFile());
        return;
      }
    }
    showMsg(id, 'err', 'No image in clipboard. Right-click image → Copy Image.');
  });

  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('active'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('active'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleImageFile(id, file);
    else showMsg(id, 'err', 'Not an image.');
  });
}

// ── Image handling ──
function showMsg(id, type, text) {
  const el = document.getElementById(`msg-${id}`);
  if (el) el.innerHTML = text ? `<div class="msg ${type}">${text}</div>` : '';
}

function handleImageFile(id, file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    pending.set(id, e.target.result);
    updatePendingCount();
    // Update just this card's paste zone
    const zone = document.getElementById(`paste-${id}`);
    if (zone) {
      zone.classList.add('has-image');
      zone.innerHTML = `<img src="${e.target.result}" /><div class="paste-actions"><button class="btn-clear" onclick="event.stopPropagation();clearPaste('${id}')">✕ Clear</button></div>`;
    }
    // Update badge
    const card = document.getElementById(`card-${id}`);
    const badge = card?.querySelector('.badge');
    if (badge) { badge.className = 'badge pending'; badge.textContent = '⏳ Pending'; }
    showMsg(id, 'ok', 'Image ready — click Save All to save.');
  };
  reader.readAsDataURL(file);
}

function clearPaste(id) {
  pending.delete(id);
  updatePendingCount();
  const isDone = existing.has(id) || downloaded.has(id);
  const zone = document.getElementById(`paste-${id}`);
  if (zone) {
    zone.classList.remove('has-image');
    zone.innerHTML = isDone
      ? `<span>📋 Paste to replace (<kbd>⌘V</kbd>)</span>`
      : `<span>📋 Paste image here (<kbd>⌘V</kbd>)</span><span class="hint">or drag &amp; drop</span>`;
  }
  const card = document.getElementById(`card-${id}`);
  const badge = card?.querySelector('.badge');
  if (badge && !isDone) { badge.className = 'badge'; badge.textContent = 'Missing'; }
  if (badge && isDone) { badge.className = 'badge done'; badge.textContent = '✓ Done'; }
  showMsg(id, '', '');
}

// ── Save All ──
async function saveAll() {
  if (pending.size === 0) return;
  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true;
  btn.innerHTML = '💾 Saving… <span class="count">0/' + pending.size + '</span>';

  const entries = [...pending.entries()];
  let saved = 0, failed = 0;

  for (const [id, dataUrl] of entries) {
    try {
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, data: dataUrl }),
      });
      const data = await res.json();
      if (data.ok) {
        saved++;
        pending.delete(id);
        downloaded.add(id);
        showMsg(id, 'ok', `✓ Saved as ${id}.jpg`);
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.add('done');
      } else {
        failed++;
        showMsg(id, 'err', `Error: ${data.error}`);
      }
    } catch (err) {
      failed++;
      showMsg(id, 'err', `Network error: ${err.message}`);
    }
    btn.innerHTML = `💾 Saving… <span class="count">${saved + failed}/${entries.length}</span>`;
  }

  updateStats();
  const summary = failed ? `Saved ${saved}, failed ${failed}` : `All ${saved} images saved!`;
  btn.innerHTML = `💾 ${summary}`;
  setTimeout(() => {
    btn.innerHTML = '💾 Save All <span class="count" id="pendingCount">0</span>';
    updatePendingCount();
    renderCards();
  }, 2000);
}

// ── Init ──
(async () => {
  await loadExisting();
  updateStats();
  renderCards();
  document.getElementById('filterSearch').addEventListener('input', renderCards);
})();
</script>
</body>
</html>
